# Cart Radar — Docker Compose for one-click local launch
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  NORMAL USERS (no build required)                                       │
# │  Uses pre-built images from GitHub Container Registry.                  │
# │                                                                         │
# │    docker compose pull    # download the latest images                  │
# │    docker compose up -d   # start Cart Radar                            │
# │    docker compose down    # stop Cart Radar                             │
# │                                                                         │
# │  Or just double-click the launcher for your OS:                         │
# │    macOS   →  Cart Radar.command                                        │
# │    Windows →  Cart Radar.bat                                            │
# │    Linux   →  Cart Radar.sh                                             │
# └─────────────────────────────────────────────────────────────────────────┘
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  DEVELOPERS (build from source)                                         │
# │  Use the override file to build images locally instead of pulling them. │
# │                                                                         │
# │    docker compose -f docker-compose.yml -f docker-compose.build.yml \   │
# │      up --build                                                         │
# │                                                                         │
# │  Or use the hot-reload developer workflow (no Docker needed):           │
# │    ./dev.sh                                                             │
# └─────────────────────────────────────────────────────────────────────────┘

services:

  # ── Backend (FastAPI + uvicorn + Playwright) ─────────────────────────────
  backend:
    image: ghcr.io/harsh-gopal/cartradar-backend:latest
    restart: unless-stopped
    environment:
      # DEV_MODE=true removes the auth-token requirement so the app works
      # out of the box without any extra configuration.
      - DEV_MODE=true
      # Enable all stable platforms by default.
      - ENABLED_PLATFORMS=zepto,swiggy,bigbasket,blinkit,bbnow
      # PROXY_URL: optional — read from .env file if present.
      - PROXY_URL=${PROXY_URL:-}
      # DATABASE_PATH: persist the store-discovery cache across restarts.
      # Must match the volume mount path below.
      - DATABASE_PATH=/data/stores.db
    volumes:
      # Named volume so the SQLite store-discovery cache persists across
      # container restarts and image updates.
      - cart-radar-data:/data
    # Healthcheck: backend is ready when /api/ping returns HTTP 200.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ping')\" 2>/dev/null || exit 1"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 90s
    # Only exposed internally — the frontend nginx proxies /api to here.
    expose:
      - "8000"

  # ── Frontend (React app served by nginx) ─────────────────────────────────
  frontend:
    image: ghcr.io/harsh-gopal/cartradar-frontend:latest
    restart: unless-stopped
    ports:
      # Cart Radar is accessible at http://localhost:3000 on the host.
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # Persistent store-discovery cache — survives container restarts and updates.
  cart-radar-data:
