[project]
name = "cart-radar-backend"
version = "0.1.0"
description = "Check product availability across Zepto, Swiggy Instamart, BigBasket and more"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "playwright>=1.61.0",
    "brotli>=1.2.0",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
